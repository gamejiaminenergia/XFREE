[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "jev-service"
version = "0.1.0"
description = "HTTP/WebSocket service over the jev-duum headless session"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
readme = "README.md"
# The pilot stays thin (its only dependency is Duum); the web layer lives here.
dependencies = [
  "fastapi>=0.115",
  # [standard] trae la implementación de WebSocket (websockets/wsproto); sin
  # ella uvicorn rechaza el upgrade y /ws responde 404.
  "uvicorn[standard]>=0.30",
  "jev-duum",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.12"]

[project.scripts]
jev-service = "jev_service.server:main"

[tool.uv.sources]
jev-duum = { path = "../jev-duum", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["jev_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
