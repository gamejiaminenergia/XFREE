[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "jev-duum"
version = "0.1.0"
description = "Remote semantic Jev (TypeSafe System One) control for the pure-Python Duum engine"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["duum"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]

[project.scripts]
jev-duum = "jev_duum.cli:main"
jev-duum-eval = "jev_duum.evaluation:main"

[tool.uv.sources]
duum = { path = "../duum", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["jev_duum"]

[tool.hatch.build.targets.sdist]
include = [
  "/jev_duum",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/FREEDOOM_LICENSE.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
